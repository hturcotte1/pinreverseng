[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopilot-cleanroom"
version = "0.1.0"
description = "Clean-room reimplementation of an AI recruiting reply agent (pipeline, inbox, knowledge base, scheduling, Slack escalation)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
autopilot-demo = "autopilot.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
